name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.2"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development and packaging tools
        run: uv sync --locked --all-extras --group packaging

      - name: Test
        run: uv run --locked --all-extras --group packaging pytest -W error

      - name: Lint
        run: uv run --locked --all-extras --group packaging ruff check .

      - name: Check formatting
        run: uv run --locked --all-extras --group packaging ruff format --check .

      - name: Check types
        run: uv run --locked --all-extras --group packaging mypy --python-version ${{ matrix.python-version }}

      - name: Build wheel from source archive
        run: uv build

      # A fresh checkout/build produces exactly one wheel and one source archive.
      - name: Audit distribution contents and metadata
        run: uv run --locked --all-extras --group packaging python scripts/check_distribution.py dist/*.whl dist/*.tar.gz

      - name: Validate package-index description
        run: uv run --locked --all-extras --group packaging twine check --strict dist/*.whl dist/*.tar.gz

      - name: Verify isolated wheel installations and provider extras
        run: uv run --locked --all-extras --group packaging python scripts/check_wheel_environments.py
